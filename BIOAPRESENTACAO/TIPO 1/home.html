<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/homeStilo.css">
    <title>Soluções Elétricas</title>
</head>
<body>
    <header>
        <div id="boxImg_Capa">
            <img id="ft_capa">
        </div>
        <img id="ft_perfil" src="./IMAGENS/M2e.jpg">
    </header>
    <main>
        <section id="boxBar_Dados">
            <h1 id="titulo">ENG. HENRIQUE PICANÇO</h1>
            <div class ="itemInfo">
                <img class="infoIcon" id="img_DescTrab" src="./IMAGENS/assinatura.svg">
                <p>Soluções energéticas para empresas e residências</p>
            </div>
            <div class ="itemInfo">
                <img class="infoIcon" id="img_CredCrea" src="./IMAGENS/licence.svg">
                <p>CREA n:xxxxxx-x</p>
            </div>
            <div class ="itemInfo">
                <img class="infoIcon" id="img_Loc" src="./IMAGENS/planeta.svg">
                <p>Macapá - AP</p>
            </div>
        </section>
        <section id="boxBar_Contatos">
            <button id="bt_lik" class="bt_contatos">
                <img id="img_lik" class="img_contatos" src="./IMAGENS/linkedin.png">
            </button>
            <button id="bt_zap" class="bt_contatos">
                <img id="img_zap" class="img_contatos" src="./IMAGENS/whatsapp.png">
            </button>
            <button id="bt_mail" class="bt_contatos">
                <img id="img_mail" class="img_contatos" src="./IMAGENS/envelope.png">
            </button>
            <button id="bt_git" class="bt_contatos">
                <img id="img_git" class="img_contatos" src="./IMAGENS/github.png">
            </button>
            <button id="bt_insta" class="bt_contatos">
                <img id="img_insta" class="img_contatos" src="./IMAGENS/instagram.png">
            </button>
        </section>
        <section id="boxBar_Acao">
            <button id="bt_msg" class="bt_acao">SERVIÇOS</button>
            <button id="bt_serv" class="bt_acao">EM QUE POSSO AJUDAR</button>
        </section>
        <section id="boxBar_Repertorio">
            <h2>INVENTÁRIO</h2>
            <div id="itemReper_1" class="itemReper">
                <div class="dentoImg">
                    <h3 class="dentoImg">Prototipagem - SIMOUT</h3>
                    <p class="dentoImg">Descrição breve</p>
                </div>
                <div class="boxImg_Reper">
                    <img id="img_itemReper_1" class="img_itemReper">
                </div>
            </div>
            <div id="itemReper_2" class="itemReper">
                <div class="dentoImg">
                    <h3 class="dentoImg">Sistema de Monitoramento Remoto</h3>
                    <p class="dentoImg">Descrição breve</p>
                </div>
                <img id="img_itemReper_2" class="img_itemReper">
            </div>
        </section>
    </main>
    <footer>
        
    </footer>

<script scr="./JS/Rodai.js"></script>
